version: '3.8'

services:
  tts-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnivoice-tts
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEVICE=auto
      - CORS_ORIGINS=*
      - MAX_TEXT_LENGTH=5000
      - SAMPLE_RATE=22050
      - MODEL_CACHE_DIR=/app/models_cache
    volumes:
      - tts_models_cache:/app/models_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  tts_models_cache:
    driver: local
